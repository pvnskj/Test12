name: Portfolio quality

on:
  push:
    branches:
      - 'redesign/**'
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Astro and TypeScript check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Build static site
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser and accessibility tests
        run: npm run test:e2e

      - name: Upload browser test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-test-artifacts
          path: |
            package-lock.json
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
